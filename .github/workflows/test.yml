name: Test install

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    defaults:
      run:
        shell: bash -el {0}

    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: bootstrap
          channels: conda-forge
          conda-remove-defaults: true
          python-version: ${{ matrix.python-version }}

      - name: Install published DAS with Conda Qt
        id: install
        run: |
          conda create -n das -c conda-forge --strict-channel-priority python=${{ matrix.python-version }} pyside6 ffmpeg "numcodecs<0.16" uv -y
          conda activate das
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            conda install -c conda-forge --strict-channel-priority "libopenblas=*=*pthreads*" -y
          fi
          uv pip install das --torch-backend=auto
          uv pip install "xarray-behave @ git+https://github.com/janclemenslab/xarray-behave.git@671030b011a6dab978281c7c48e569fb3cc77e4a"

      - name: Test GUI startup and PyTorch
        run: |
          conda activate das
          python -X faulthandler - <<'PY'
          import sys
          import importlib.metadata as md
          import subprocess
          import das
          import torch
          from PySide6 import QtCore, QtWidgets
          from das import cli

          print({name: md.version(name) for name in ["das", "xarray-behave", "PySide6", "numcodecs", "torch"]}, flush=True)
          assert not any(d.metadata["Name"].lower() == "pyside6-essentials" for d in md.distributions())
          x = torch.ones(2, requires_grad=True)
          (x * x).sum().backward()
          assert torch.equal(x.grad, torch.full((2,), 2.))
          app = QtWidgets.QApplication([])
          visible = []

          def close():
              visible.extend(window for window in app.topLevelWidgets() if window.isVisible())
              app.closeAllWindows()
              app.quit()

          QtCore.QTimer.singleShot(500, close)
          sys.argv = ["das", "gui"]
          cli.main()
          assert any(isinstance(window, QtWidgets.QMainWindow) for window in visible)
          subprocess.run(["ffmpeg", "-version"], check=True, stdout=subprocess.DEVNULL)
          PY

      - name: Test GUI training and prediction windows
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          conda activate das
          python -X faulthandler - <<'PY'
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          import das
          from PySide6 import QtWidgets
          from xarray_behave.gui.app import MainWindow
          from xarray_behave.gui.formbuilder import YamlDialog

          app = QtWidgets.QApplication([])
          window = MainWindow()
          dialogs = []

          def reject(dialog):
              dialogs.append(dialog)
              return QtWidgets.QDialog.Rejected

          with tempfile.TemporaryDirectory() as directory:
              model = str(Path(directory) / "test_model.h5")
              (Path(directory) / "test_params.yaml").write_text("{}")
              with patch.object(QtWidgets.QFileDialog, "getExistingDirectory", return_value=directory), patch.object(QtWidgets.QFileDialog, "getOpenFileName", return_value=(model, "")), patch.object(YamlDialog, "exec_", reject):
                  for tab, field in (("train", "data_dir"), ("predict", "model_path")):
                      window._open_das_window(tab)
                      assert len(dialogs) == 1, f"DAS {tab} window is unavailable"
                      assert field in dialogs[0].form.fields
                      dialogs.pop().close()
          window.close()
          PY

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          conda activate das
          uv pip install pytest
          pytest -q

      - name: Test command line
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          conda activate das
          das version
          das train --help
          das predict --help
          das gui --help
