name: Test install

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: das
          channels: conda-forge
          conda-remove-defaults: true
          python-version: "3.13"
      - name: Install Conda Qt and FFmpeg
        run: |
          conda install -c conda-forge --strict-channel-priority ffmpeg uv "pyside6=6.10.*" qt6-multimedia -y
          uv pip install qtpy
          ffmpeg -version
      - name: Test native Qt
        run: |
          python - <<'PYCODE'
          import importlib.metadata as metadata
          from qtpy import QtCore, QtWidgets, QtMultimedia
          app = QtWidgets.QApplication([])
          window = QtWidgets.QWidget()
          window.show()
          app.processEvents()
          assert window.isVisible()
          window.close()
          print(f"Conda Qt works: {QtCore.qVersion()}")
          print(f"PySide6 metadata: {metadata.version('PySide6')}")
          PYCODE
