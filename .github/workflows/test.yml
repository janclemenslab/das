name: Test install

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash -el {0}

    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: das
          channels: conda-forge
          conda-remove-defaults: true
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: conda install -c conda-forge ffmpeg uv -y

      - name: Build and install DAS
        run: |
          uv build --wheel
          uv pip install "$(find dist -name 'das-*.whl' -print -quit)" pytest --torch-backend=auto
          uv pip check

      - name: Run tests
        run: pytest -q

      - name: Test command line
        run: |
          das version
          das train --help
          das predict --help
          das gui --help
