name: Test install

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.13"]

    defaults:
      run:
        shell: bash -el {0}

    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: das
          channels: conda-forge
          conda-remove-defaults: true
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: conda install -c conda-forge ffmpeg uv -y

      - name: Build and install DAS
        run: |
          uv build --wheel
          uv pip install "$(find dist -name 'das-*.whl' -print -quit)" pytest --torch-backend=auto
          uv pip check

      - name: Diagnose Qt DLL imports
        run: |
          uv pip install pefile
          python -u - <<'PYCODE'
          import subprocess
          import sys
          for code in ["from PySide6 import QtCore", "import torch; from PySide6 import QtCore", "from PySide6 import QtCore; import das", "import das; from PySide6 import QtCore"]:
              print(f"CHECK: {code}", flush=True)
              result = subprocess.run([sys.executable, "-c", code])
              print(f"EXIT: {result.returncode}", flush=True)
          import das
          import ctypes
          from pathlib import Path
          import PySide6
          import shiboken6
          import pefile
          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel32.GetProcAddress.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          kernel32.GetProcAddress.restype = ctypes.c_void_p
          kernel32.GetModuleFileNameW.argtypes = [ctypes.c_void_p, ctypes.c_wchar_p, ctypes.c_ulong]
          for folder in [Path(PySide6.__file__).parent, Path(shiboken6.__file__).parent]:
              for name in ["QtCore.pyd", "Qt6Core.dll", "pyside6.abi3.dll", "shiboken6.abi3.dll"]:
                  path = folder / name
                  if not path.exists():
                      continue
                  print(f"IMPORTS: {path}", flush=True)
                  for entry in pefile.PE(str(path)).DIRECTORY_ENTRY_IMPORT:
                      name = entry.dll.decode()
                      try:
                          dll = ctypes.WinDLL(name)
                      except OSError as exc:
                          print(f"CANNOT LOAD: {name}: {exc}", flush=True)
                          continue
                      buffer = ctypes.create_unicode_buffer(32768)
                      kernel32.GetModuleFileNameW(dll._handle, buffer, len(buffer))
                      print(f"LOADED: {buffer.value}", flush=True)
                      for imp in entry.imports:
                          if imp.name and not kernel32.GetProcAddress(dll._handle, imp.name):
                              print(f"MISSING: {name}: {imp.name.decode()}", flush=True)
          PYCODE

      - name: Test GUI startup
        run: |
          python -X faulthandler - <<'PY'
          import das
          from PySide6 import QtCore, QtGui, QtWidgets
          from xarray_behave.gui.app import main_das

          app = QtWidgets.QApplication([])
          window = QtWidgets.QWidget()
          window.show()
          app.processEvents()
          assert window.isVisible()
          window.close()
          print(f"GUI available with Qt {QtCore.qVersion()}")
          PY

      - name: Run tests
        run: pytest -q

      - name: Test command line
        run: |
          das version
          das train --help
          das predict --help
          das gui --help
