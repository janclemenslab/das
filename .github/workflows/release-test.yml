name: Release tests

on:
  push:
    branches: [release/0.32.12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install release wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install "$(find dist -name 'das-*.whl' -print -quit)" pytest
          python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Test CLI
        shell: bash
        run: |
          das version
          das train --help >/dev/null
          das predict --help >/dev/null
          das gui --help >/dev/null
