# Long-context sine specialist.
mode: train
data_dir: /Users/janc/data/Stern2017/dat.annotated
output_dir: ./runs/stern2017-sine-specialist
checkpoint_prefix: stern2017-sine-specialist

batch_size: 4
num_time_steps: 40960
chunk_stride: 20480
num_workers: 0
validation_fraction: 0.3333333333333333
test_fraction: 0.3333333333333333
split_within_files: false
include_labels: [sine]

frontend_type: mel
frontend_num_channels: 64
frontend_kernel_size: 256
frontend_hop_seconds: 0.004
frontend_fmin: 50.0

encoder_type: conformer
encoder_num_heads: 4
encoder_hidden_size: 64
encoder_num_layers: 2
encoder_kernel_size: 31

decoder_type: linear
cross_entropy_weight: 1.0
learning_rate: 0.0003
early_stopping: false
reduce_lr: true
num_epochs: 5
max_num_steps_per_epoch: 200
seed: 0

fill_gap_ms: 10.0
min_syllable_ms: 10.0
syllable_tolerance_ms: 30.0
tune_postprocessing: true
postprocessing_tuning_step_ms: 4.0
postprocessing_tuning_max_fill_gap_ms: 100.0
postprocessing_tuning_max_min_syllable_ms: 100.0
