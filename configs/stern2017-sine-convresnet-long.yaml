# Long-context sine activity model with 1 ms waveform features.
mode: train
data_dir: /Users/janc/data/Stern2017/dat.annotated
output_dir: ./runs/stern2017-sine-convresnet-long
checkpoint_prefix: stern2017-sine-convresnet-long
# The reported run was warm-started with the earlier joint ConvResNet--Conformer
# checkpoint. Pass that checkpoint with --initial-model when it is available.

batch_size: 2
num_time_steps: 40960
chunk_stride: 20480
num_workers: 0
validation_fraction: 0.3333333333333333
test_fraction: 0.3333333333333333
split_within_files: false
include_labels: [sine]

frontend_type: conv_resnet
frontend_num_channels: 64
frontend_kernel_size: 9
frontend_hop_seconds: 0.001
frontend_pad_mode: reflect

encoder_type: conformer
encoder_num_heads: 4
encoder_hidden_size: 64
encoder_num_layers: 2
encoder_kernel_size: 31

decoder_type: linear
cross_entropy_weight: 1.0
learning_rate: 0.0002
early_stopping: false
reduce_lr: true
num_epochs: 5
max_num_steps_per_epoch: 200
seed: 0

fill_gap_ms: 80.0
min_syllable_ms: 92.0
syllable_tolerance_ms: 30.0
tune_postprocessing: false
