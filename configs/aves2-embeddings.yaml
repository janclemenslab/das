encoder_type: aves2
encoder_model_id: esp_aves2_sl_beats_all
encoder_checkpoint: ~/.cache/das/avex/avex_aves2.pt2
encoder_hop_seconds: 1.0
encoder_cache_dir: ./embeddings/aves2
# On Python 3.11-3.13, omit encoder_checkpoint to load AVES2 through AVEX directly.
decoder_type: linear
# 20 seconds at 16 kHz. Set this for the sample rate of your input recordings.
num_time_steps: 320000
chunk_stride: 160000
cross_entropy_weight: 1.0
accelerator: auto
