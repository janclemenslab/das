# Pulse-only reproduction of the classical DAS raw-waveform TCN recipe.
mode: train
data_dir: /Users/janc/data/Stern2017/dat.annotated
output_dir: ./runs/stern2017-pulse-classic-tcn
checkpoint_prefix: stern2017-pulse-classic-tcn

batch_size: 32
num_time_steps: 2048
chunk_stride: 1952
num_workers: 0
validation_fraction: 0.3333333333333333
test_fraction: 0.3333333333333333
split_within_files: false
include_labels: [pulse]
min_annotation_duration_ms: 4.0

frontend_type: raw

encoder_type: tcn
encoder_hidden_size: 32
encoder_num_layers: 3
encoder_kernel_size: 16
encoder_dilations: [1, 2, 4, 8, 16]
encoder_dropout: 0.0
encoder_use_skip_connections: true
encoder_use_separable: [false, false, false]
encoder_padding: same

decoder_type: linear
cross_entropy_weight: 1.0
learning_rate: 0.0001
early_stopping: false
reduce_lr: false
num_epochs: 18
max_num_steps_per_epoch: 200
seed: 0

fill_gap_ms: 0.0
min_syllable_ms: 0.0
syllable_tolerance_ms: 10.0
tune_postprocessing: false
