mode: train
data_dir: /Users/janc/data/fly_audio/chainingmic_dawn_npy
data_samplerate_hz: 10000
output_dir: ./runs/fly-audio-multichannel-sine
checkpoint_prefix: fly-audio-multichannel-sine
initial_model: ./runs/stern2017-all-sine/checkpoints/stern2017-all-sine_20260906_095352_model.ckpt

batch_size: 1
num_time_steps: 10240
chunk_stride: 5120
num_workers: 0
validation_fraction: 0.25
test_fraction: 0.25
split_within_files: false
