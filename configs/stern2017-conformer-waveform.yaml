# Learned waveform filterbank + Conformer experiment for Stern2017 fly song.
mode: train
data_dir: /Users/janc/Library/CloudStorage/Dropbox/Stern2017/dat.annotated
output_dir: ./runs/stern2017-conformer-waveform
checkpoint_prefix: stern2017-waveform

batch_size: 8
num_time_steps: 4096
chunk_stride: 2048
num_workers: 0
validation_fraction: 0.3333333333333333
test_fraction: 0.3333333333333333
split_within_files: false
include_labels: [pulse, sine]

# A trainable 1-D filterbank keeps waveform transients, then reduces the
# Conformer sequence from 10,000 samples/s to 1,000 frames/s.
frontend_type: conv
frontend_num_channels: 64
frontend_kernel_size: 64
frontend_hop_seconds: 0.001

encoder_type: conformer
encoder_num_heads: 4
encoder_hidden_size: 64
encoder_num_layers: 2
encoder_kernel_size: 31

decoder_type: linear
cross_entropy_weight: 1.0
learning_rate: 0.0003
early_stopping: true
early_stopping_patience: 5
reduce_lr: true
num_epochs: 50
max_num_steps_per_epoch: 200
seed: 0

fill_gap_ms: 2.0
min_syllable_ms: 2.0
syllable_tolerance_ms: 10.0
tune_postprocessing: false
