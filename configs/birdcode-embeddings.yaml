encoder_type: birdcode
encoder_cache_dir: ./embeddings/birdcode
# Preserve all 38 temporal frames per five-second window (~132 ms per frame).
decoder_type: linear
# 20 seconds at 32 kHz. Adjust for your input recordings' sample rate.
num_time_steps: 640000
chunk_stride: 320000
cross_entropy_weight: 1.0
accelerator: auto
