mode: train
batch_size: 8
num_time_steps: 4096
chunk_stride: 2048
include_labels: [pulse]
frontend_type: conv_resnet
frontend_num_channels: 64
frontend_kernel_size: 9
frontend_hop_seconds: 0.001
frontend_pad_mode: reflect
encoder_type: tcn
encoder_hidden_size: 64
encoder_num_layers: 1
encoder_kernel_size: 3
encoder_dilations: [1, 2, 4, 8, 16]
encoder_dropout: 0.1
encoder_use_skip_connections: true
decoder_type: linear
cross_entropy_weight: 1.0
learning_rate: 0.0003
fill_gap_ms: 0.0
min_syllable_ms: 0.0
syllable_tolerance_ms: 10.0
